<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="fridge">
  <title>fridge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>fridge</h1>
    <button class="icon-btn" id="open-settings" aria-label="설정">⚙︎</button>
  </header>

  <section class="summary">
    <button class="stat bad" data-jump="expired"><b id="cnt-expired">0</b><span>기한 지남</span></button>
    <button class="stat warn" data-jump="soon"><b id="cnt-soon">0</b><span id="soon-label">3일 이내</span></button>
    <button class="stat ok" data-jump="ok"><b id="cnt-total">0</b><span>전체</span></button>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-place="all">전체</button>
    <button class="tab" data-place="냉장">냉장</button>
    <button class="tab" data-place="냉동">냉동</button>
    <button class="tab" data-place="실온">실온</button>
  </nav>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="재료 검색" autocomplete="off">
  </div>

  <main id="list"></main>

  <button class="fab" id="add-btn" aria-label="재료 추가">＋</button>

  <!-- 재료 추가/수정 -->
  <div class="sheet-bg" id="item-sheet">
    <form class="sheet" id="item-form" autocomplete="off">
      <div class="sheet-head">
        <button type="button" class="link" data-close>취소</button>
        <h2 id="sheet-title">재료 추가</h2>
        <button type="submit" class="link strong">저장</button>
      </div>

      <div id="presets-wrap">
        <div class="label">자주 사는 재료</div>
        <div class="presets" id="presets"></div>
      </div>

      <div class="row">
        <button type="button" class="emoji-btn" id="emoji-btn">🥬</button>
        <input id="f-name" placeholder="재료 이름" required>
      </div>

      <div class="label">보관 장소</div>
      <div class="seg" id="f-place">
        <button type="button" data-v="냉장" class="on">냉장</button>
        <button type="button" data-v="냉동">냉동</button>
        <button type="button" data-v="실온">실온</button>
      </div>

      <div class="label">유통기한</div>
      <input id="f-exp" type="date" required>
      <div class="quick" id="quick-exp">
        <button type="button" data-d="1">+1일</button>
        <button type="button" data-d="3">+3일</button>
        <button type="button" data-d="7">+1주</button>
        <button type="button" data-d="14">+2주</button>
        <button type="button" data-d="30">+1달</button>
        <button type="button" data-d="90">+3달</button>
      </div>
      <div class="hint" id="exp-hint"></div>

      <div class="grid2">
        <div>
          <div class="label">수량</div>
          <div class="qty-row">
            <input id="f-count" type="number" inputmode="decimal" min="0" step="any" value="1">
            <input id="f-unit" placeholder="개" list="units">
          </div>
          <datalist id="units"><option>개</option><option>모</option><option>봉</option><option>팩</option><option>병</option><option>캔</option><option>g</option><option>ml</option></datalist>
        </div>
        <div>
          <div class="label">산 날</div>
          <input id="f-buy" type="date">
        </div>
      </div>

      <div class="label">메모</div>
      <input id="f-memo" placeholder="예: 개봉함, 반 남음">

      <div class="actions" id="edit-actions">
        <button type="button" class="btn ok" id="eat-btn">다 먹었어요</button>
        <button type="button" class="btn bad" id="toss-btn">버렸어요</button>
      </div>
    </form>
  </div>

  <!-- 이모지 고르기 -->
  <div class="sheet-bg" id="emoji-sheet">
    <div class="sheet small">
      <div class="sheet-head">
        <span></span><h2>아이콘</h2><button type="button" class="link" data-close>닫기</button>
      </div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="sheet-bg" id="settings-sheet">
    <div class="sheet small">
      <div class="sheet-head">
        <span></span><h2>설정</h2><button type="button" class="link" data-close>닫기</button>
      </div>
      <div class="label">임박 알림 기준</div>
      <div class="seg" id="soon-days">
        <button type="button" data-v="2">2일</button>
        <button type="button" data-v="3">3일</button>
        <button type="button" data-v="5">5일</button>
        <button type="button" data-v="7">7일</button>
      </div>
      <div class="label">이번 달 기록</div>
      <div class="stats-line" id="month-stats"></div>
      <div class="label">백업</div>
      <p class="hint">아이폰에서 앱을 지우거나 사파리 데이터를 지우면 기록이 사라져요. 가끔 백업 파일을 저장해 두세요.</p>
      <div class="actions">
        <button type="button" class="btn" id="export-btn">백업 저장</button>
        <button type="button" class="btn" id="import-btn">백업 불러오기</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <p class="version" id="version"></p>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">되돌리기</button></div>

  <script src="app.js"></script>
</body>
</html>
